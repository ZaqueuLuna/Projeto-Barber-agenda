{% extends "base.html" %}
{% block titulo %}Alterar senha{% endblock %}
{% block conteudo %}
<header class="topo"><h1>Alterar senha</h1></header>
<form method="post" class="formulario">
  <label class="form-label" for="senha_atual">Senha atual</label>
  <input class="form-control mb-3" type="password" id="senha_atual" name="senha_atual" required autofocus>
  <label class="form-label" for="nova_senha">Nova senha (mínimo de 6 caracteres)</label>
  <input class="form-control mb-3" type="password" id="nova_senha" name="nova_senha" minlength="6" required>
  <label class="form-label" for="confirmacao">Repita a nova senha</label>
  <input class="form-control mb-4" type="password" id="confirmacao" name="confirmacao" minlength="6" required>
  <div class="acoes">
    <button class="btn btn-primario" type="submit">Alterar senha</button>
    <a class="btn btn-secundario" href="{{ url_for('agenda.dia') }}">Voltar</a>
  </div>
</form>
{% endblock %}
