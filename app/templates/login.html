{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block publico %}
<div class="tela-login">
  <div class="cartao-login">
    <div class="poste" aria-hidden="true"></div>
    <h1>BarberAgenda</h1>
    <p class="sub">Agenda da barbearia em um só lugar.</p>
    {% include "_avisos.html" %}
    <form method="post" novalidate>
      <label class="form-label" for="email">Usuário ou e-mail</label>
      <input class="form-control mb-3" type="text" id="email" name="email" value="{{ email }}" autocomplete="username" required autofocus>
      <label class="form-label" for="senha">Senha</label>
      <input class="form-control mb-4" type="password" id="senha" name="senha" required>
      <button class="btn btn-primario w-100" type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
